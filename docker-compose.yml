version: '3.8'

services:
  # Cerebro 1: Base de Datos CockroachDB (Don Roc - Memoria Inmutable)
  db:
    image: cockroachdb/cockroach:v23.1.10
    container_name: valentina-db
    command: start-single-node --insecure --listen-addr=0.0.0.0
    environment:
      - COCKROACH_DATABASE=valentina
    ports:
      - "26257:26257"   # PostgreSQL-compatible port
      - "8080:8080"     # Admin UI
    volumes:
      - crdb-data:/cockroach/cockroach-data
    networks:
      - valentina-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health?ready=1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Cerebro 5: API FastAPI (Comunicación y orquestación)
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: valentina-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      - CRDB_HOST=db
      - CRDB_PORT=26257
      - CRDB_DATABASE=valentina
      - CRDB_USER=root
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ROCM_ENABLED=${ROCM_ENABLED:-false}
      - LOG_LEVEL=INFO
      - API_HOST=0.0.0.0
      - API_PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - /app/__pycache__
    networks:
      - valentina-network
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

  # Cerebro 9: Frontend Nginx (Interfaz War Room)
  frontend:
    image: nginx:alpine
    container_name: valentina-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - valentina-network
    depends_on:
      - api
    restart: unless-stopped

  # Opcional: Prometheus para monitoreo de los Cerebros
  prometheus:
    image: prom/prometheus:latest
    container_name: valentina-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - valentina-network
    restart: unless-stopped
    profiles:
      - monitoring

networks:
  valentina-network:
    driver: bridge

volumes:
  crdb-data:
    driver: local
  prometheus-data:
    driver: local
